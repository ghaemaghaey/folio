name: Android

# Build debug + release APK when android/ sources change, or on version tags.
# On tag pushes, uploads APKs to the same GitHub Release as other workflows.

on:
  push:
    branches: [main, master]
    tags:
      - "v*"
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: |
          if [ -f ./gradlew ]; then chmod +x ./gradlew; fi

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          # Fallback if ANDROID_HOME unset
          if [ -z "$ANDROID_HOME" ] && [ -n "$ANDROID_SDK_ROOT" ]; then
            echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          fi
          cat local.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        env:
          # Proxy not needed on GHA; keep org.gradle props clean
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
        run: |
          # Prefer wrapper; if jar missing, use system gradle via setup-gradle
          if [ -f ./gradlew ] && [ -f ./gradle/wrapper/gradle-wrapper.jar ]; then
            ./gradlew :app:assembleDebug --no-daemon --stacktrace
          else
            gradle :app:assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: folio-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Build release APK (R8 minification)
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
        run: |
          if [ -f ./gradlew ] && [ -f ./gradle/wrapper/gradle-wrapper.jar ]; then
            ./gradlew :app:assembleRelease --no-daemon --stacktrace
          else
            gradle :app:assembleRelease --no-daemon --stacktrace
          fi

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: folio-android-release
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: warn

      - name: Summary
        run: |
          apk="app/build/outputs/apk/debug/app-debug.apk"
          {
            echo "### Android debug APK"
            echo ""
            if [ -f "$apk" ]; then
              echo "Size: $(du -h "$apk" | cut -f1)"
              echo ""
              echo "Download the **folio-android-debug** artifact from this run."
            else
              echo "APK missing"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # ── Release upload (tag pushes only) ──────────────────────────────
      - name: Upload debug APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/release/app-release-unsigned.apk
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

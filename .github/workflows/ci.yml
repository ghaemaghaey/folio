name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-amd64
            os: windows-latest
            goos: windows
            goarch: amd64
            ext: .exe
            ldflags: -s -w -H windowsgui
            cgo: "0"
            artifact: folio-windows-amd64
          - label: linux-amd64
            os: ubuntu-22.04
            goos: linux
            goarch: amd64
            ext: ""
            ldflags: -s -w
            cgo: "1"
            artifact: folio-linux-amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true

      - name: Install Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libgtk-3-dev libwebkit2gtk-4.0-dev \
            || sudo apt-get install -y \
            build-essential pkg-config \
            libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
        shell: bash
        run: |
          mkdir -p build/bin
          go build -tags production -ldflags "${{ matrix.ldflags }}" -o "build/bin/folio${{ matrix.ext }}" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/bin/folio${{ matrix.ext }}
          if-no-files-found: error

  # Debian Trixie: checkout on the host, compile inside debian:trixie via Docker
  # so the binary links against Trixie webkit/GTK/glibc (matches Debian 13 laptops).
  build-debian-trixie:
    name: Build (debian-trixie-amd64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build inside debian:trixie
        run: |
          set -euo pipefail
          mkdir -p build/bin
          docker run --rm \
            -v "$PWD":/src \
            -w /src \
            -e CGO_ENABLED=1 \
            -e DEBIAN_FRONTEND=noninteractive \
            debian:trixie \
            bash -euxo pipefail -c '
              apt-get update
              apt-get install -y --no-install-recommends \
                ca-certificates curl git \
                build-essential pkg-config \
                gcc g++ \
                libgtk-3-dev \
                libwebkit2gtk-4.1-dev \
                libayatana-appindicator3-dev \
                libglib2.0-dev

              # Install Go matching go.mod (1.25.x)
              GO_VER=1.25.0
              curl -fsSL "https://go.dev/dl/go${GO_VER}.linux-amd64.tar.gz" \
                -o /tmp/go.tgz
              rm -rf /usr/local/go
              tar -C /usr/local -xzf /tmp/go.tgz
              export PATH=/usr/local/go/bin:$PATH
              go version

              # Show webkit pkg-config (helps debug Wails CGO)
              pkg-config --modversion webkit2gtk-4.1 || true
              pkg-config --libs --cflags gtk+-3.0 webkit2gtk-4.1

              go build -tags production -ldflags "-s -w" \
                -o build/bin/folio-linux-amd64-debian-trixie .
              ls -la build/bin/folio-linux-amd64-debian-trixie
            '

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: folio-linux-amd64-debian-trixie
          path: build/bin/folio-linux-amd64-debian-trixie
          if-no-files-found: error

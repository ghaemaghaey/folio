name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-amd64
            os: windows-latest
            goos: windows
            goarch: amd64
            ext: .exe
            ldflags: -s -w -H windowsgui
            cgo: "0"
            artifact: folio-windows-amd64
          - label: linux-amd64
            os: ubuntu-22.04
            goos: linux
            goarch: amd64
            ext: ""
            ldflags: -s -w
            cgo: "1"
            artifact: folio-linux-amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true

      - name: Install Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libgtk-3-dev libwebkit2gtk-4.0-dev \
            || sudo apt-get install -y \
            build-essential pkg-config \
            libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
        shell: bash
        run: |
          mkdir -p build/bin
          go build -tags production -ldflags "${{ matrix.ldflags }}" -o "build/bin/folio${{ matrix.ext }}" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/bin/folio${{ matrix.ext }}
          if-no-files-found: error

  # Debian Trixie: build inside the official image so the binary matches
  # webkit/GTK/glibc on Debian 13 laptops (GitHub has no native Trixie runner).
  build-debian-trixie:
    name: Build (debian-trixie-amd64)
    runs-on: ubuntu-latest
    container: debian:trixie

    steps:
      - name: Install build dependencies
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git \
            build-essential pkg-config \
            gcc g++ \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true

      - name: Build
        env:
          CGO_ENABLED: "1"
        run: |
          set -euo pipefail
          mkdir -p build/bin
          go build -tags production -ldflags "-s -w" -o build/bin/folio .
          ls -la build/bin/folio
          file build/bin/folio || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: folio-linux-amd64-debian-trixie
          path: build/bin/folio
          if-no-files-found: error

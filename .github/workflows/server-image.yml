name: Server image (GHCR)

# Slim default (~20 MB):  ghcr.io/<owner>/folio-server:latest
# Optional fat Calibre:  ghcr.io/<owner>/folio-server:with-calibre

on:
  push:
    branches: [main, master]
    tags: ["v*"]
    paths:
      - "server/**"
      - ".github/workflows/server-image.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "server/**"
      - ".github/workflows/server-image.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: Test server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache-dependency-path: server/go.sum
      - name: Unit tests
        env:
          CGO_ENABLED: "0"
        run: go test ./...

  docker-slim:
    name: Build & push slim image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - name: Image name
        id: image
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "full=${{ env.REGISTRY }}/${owner}/folio-server" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata (slim / latest)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.full }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=slim,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push slim
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha,scope=slim
          cache-to: type=gha,mode=max,scope=slim
          provenance: false

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### folio-server (slim)"
            echo "Typical size: **~15–30 MB** (Go API + pure-Go Calibre writer, no Qt)"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Fat image is optional — only built on tags or manual dispatch (saves CI time).
  docker-calibre:
    name: Build & push with-calibre image
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - name: Image name
        id: image
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "full=${{ env.REGISTRY }}/${owner}/folio-server" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push with-calibre
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile.calibre
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.image.outputs.full }}:with-calibre
            ${{ steps.image.outputs.full }}:with-calibre-${{ github.sha }}
          platforms: linux/amd64
          build-args: |
            CALIBRE_VERSION=7.26.0
          cache-from: type=gha,scope=calibre
          cache-to: type=gha,mode=max,scope=calibre
          provenance: false

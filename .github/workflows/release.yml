name: Release

# Push a version tag to publish Windows + Linux binaries to GitHub Releases:
#   git tag v0.6.3
#   git push origin v0.6.3
#
# Assets:
#   folio-windows-amd64.exe
#   folio-linux-amd64                 (Ubuntu 22.04 / broader glibc baseline)
#   folio-linux-amd64-debian-trixie   (Debian 13 / Trixie — webkit2gtk 4.1)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-amd64
            os: windows-latest
            goos: windows
            goarch: amd64
            asset: folio-windows-amd64.exe
            ldflags: -s -w -H windowsgui
            cgo: "0"
          - label: linux-amd64
            os: ubuntu-22.04
            goos: linux
            goarch: amd64
            asset: folio-linux-amd64
            ldflags: -s -w
            cgo: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true

      - name: Install Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libgtk-3-dev libwebkit2gtk-4.0-dev \
            || sudo apt-get install -y \
            build-essential pkg-config \
            libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build desktop
        working-directory: desktop
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
        shell: bash
        run: |
          mkdir -p dist
          go build -tags production -ldflags "${{ matrix.ldflags }}" -o "dist/${{ matrix.asset }}" .
          ls -la dist/

      - name: Create / update GitHub Release and upload asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Folio ${{ github.ref_name }}
          files: desktop/dist/${{ matrix.asset }}
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Build on the host with Docker (debian:trixie image) so Actions stay reliable
  # and the binary still links against Debian 13 / Trixie libraries.
  release-debian-trixie:
    name: Build debian-trixie-amd64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build inside debian:trixie
        run: |
          set -euo pipefail
          mkdir -p desktop/dist
          docker run --rm \
            -v "$PWD":/src \
            -w /src/desktop \
            -e CGO_ENABLED=1 \
            -e DEBIAN_FRONTEND=noninteractive \
            debian:trixie \
            bash -euxo pipefail -c '
              apt-get update
              apt-get install -y --no-install-recommends \
                ca-certificates curl git \
                build-essential pkg-config \
                gcc g++ \
                libgtk-3-dev \
                libwebkit2gtk-4.1-dev \
                libayatana-appindicator3-dev \
                libglib2.0-dev

              GO_VER=1.25.0
              curl -fsSL "https://go.dev/dl/go${GO_VER}.linux-amd64.tar.gz" \
                -o /tmp/go.tgz
              rm -rf /usr/local/go
              tar -C /usr/local -xzf /tmp/go.tgz
              export PATH=/usr/local/go/bin:$PATH
              go version

              pkg-config --modversion webkit2gtk-4.1 || true
              pkg-config --libs --cflags gtk+-3.0 webkit2gtk-4.1

              # -buildvcs=false: mounted .git often fails "error obtaining VCS status"
              # inside Docker (exit 128 / safe.directory).
              # webkit2_41: Debian Trixie has webkit2gtk-4.1 only (no 4.0 .pc).
              go build -buildvcs=false -tags "production,webkit2_41" -ldflags "-s -w" \
                -o dist/folio-linux-amd64-debian-trixie .
              ls -la dist/folio-linux-amd64-debian-trixie
            '

      - name: Create / update GitHub Release and upload asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Folio ${{ github.ref_name }}
          files: desktop/dist/folio-linux-amd64-debian-trixie
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  checksums:
    name: Upload SHA256SUMS
    needs: [release, release-debian-trixie]
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets and upload checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --dir dist \
            --pattern 'folio-*'
          cd dist
          sha256sum folio-* | tee SHA256SUMS
          gh release upload "${{ github.ref_name }}" SHA256SUMS \
            --repo "${{ github.repository }}" \
            --clobber

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & publish (${{ matrix.goos }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            goos: windows
            goarch: amd64
            asset: folio-windows-amd64.exe
            ldflags: -s -w -H windowsgui
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            asset: folio-linux-amd64
            ldflags: -s -w

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true

      - name: Linux webview deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev || sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -tags production -ldflags "${{ matrix.ldflags }}" -o "dist/${{ matrix.asset }}" .

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.asset }}
          generate_release_notes: true
          draft: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  checksums:
    name: Checksums
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Download all release assets via gh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          gh release download "${{ github.ref_name }}" --repo "${{ github.repository }}" --dir dist || true
          cd dist
          if ls folio-* 1>/dev/null 2>&1; then
            sha256sum folio-* > SHA256SUMS
            gh release upload "${{ github.ref_name }}" SHA256SUMS --repo "${{ github.repository }}" --clobber
          fi

# Combined stack: calibre-web + slim folio-server (~20 MB image)
#
# folio-server does NOT bundle Calibre/Qt. Library uploads use a pure-Go
# writer that updates the shared Calibre metadata.db on /library.
#
#   docker network create finka-network   # once
#   export JWT_SECRET=...
#   docker compose -f docker-compose.calibre.yml up -d
#
# Image: ghcr.io/ghaemaghaey/folio-server:latest  (slim)

services:
  calibre-web:
    image: linuxserver/calibre-web:latest
    container_name: calibre-web
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - OAUTHLIB_RELAX_TOKEN_SCOPE=1
    volumes:
      - /data:/config
      - /library:/books
    ports:
      - "8083:8083"
    restart: unless-stopped
    networks:
      - finka-network

  folio-server:
    image: ${FOLIO_SERVER_IMAGE:-ghcr.io/ghaemaghaey/folio-server:latest}
    container_name: folio-server
    depends_on:
      - calibre-web
    environment:
      - TZ=Etc/UTC
      - LISTEN_ADDR=:8090
      - DB_PATH=/data/folio.db
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET}
      - CALIBRE_LIBRARY_PATH=/library
      # pure-Go writer (no 400MB Calibre in this image)
      - LIBRARY_WRITER=native
    volumes:
      - folio_server_data:/data
      - /library:/library
    ports:
      - "${FOLIO_SERVER_PORT:-8090}:8090"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - finka-network

volumes:
  folio_server_data:

networks:
  finka-network:
    external: true
